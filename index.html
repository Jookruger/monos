<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monos</title>
<meta name="description" content="Índice automático de diagramas y documentos HTML publicados en este repositorio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Archivo+Narrow:wght@600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/*
  MONOS · índice automático
  No hay que editar este archivo al subir un HTML nuevo.
  El índice consulta la API de GitHub, lista los .html de la raíz del repositorio y lee de cada uno:
    · Título:  <title>
    · Resumen: <meta name="description" content="...">  o, si no hay, el primer párrafo de texto
    · Fecha:   <meta name="fecha" content="2026-10-14">   o, si no hay, la fecha del último commit del archivo
    · Número:  <meta name="numero" content="3">            o, si no hay, el orden cronológico
  Para ocultar un archivo del índice: <meta name="monos" content="ocultar">
*/
:root{
  --bg:#F5F7F4; --surface:#FFFFFF; --ink:#18241E; --muted:#5B6A62; --line:#D5DDD7;
  --accent:#1F5A44; --accent-soft:#E3EEE8; --thumb:#EEF2EF;
  --f-display:"Archivo Narrow","Arial Narrow",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111814; --surface:#18221D; --ink:#E4ECE7; --muted:#9AABA2; --line:#2E3B34;
  --accent:#7CC4A4; --accent-soft:#1E3229; --thumb:#202B25; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding-block:40px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px;margin-bottom:24px}
h1{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:6px 0 0;font-size:14px}
.tools{display:flex;gap:8px;align-items:center}
input[type=search]{font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:min(260px,70vw)}
input[type=search]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.item a.row{display:grid;grid-template-columns:167px minmax(0,1fr);gap:18px;align-items:start;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;color:inherit;text-decoration:none;transition:border-color .15s}
.item a.row:hover{border-color:var(--accent)}
.item a.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.thumb{width:167px;height:167px;border-radius:6px;overflow:hidden;background:var(--thumb);border:1px solid var(--line);position:relative}
.thumb iframe{width:1200px;height:1200px;border:0;transform:scale(.13917);transform-origin:0 0;pointer-events:none;background:#fff}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.num{color:var(--accent);font-weight:500}
.title{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.2;margin:4px 0 6px;text-wrap:balance}
.sum{margin:0;color:var(--muted);font-size:14px;max-width:65ch}
.file{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:8px;overflow-wrap:anywhere}
.state{padding:24px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);text-align:center}
@media (max-width:520px){
  .item a.row{grid-template-columns:96px minmax(0,1fr);gap:12px}
  .thumb{width:96px;height:96px}
  .thumb iframe{transform:scale(.08)}
  h1{font-size:36px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Monos</h1>
      <p class="sub" id="sub">Buscando diagramas en el repositorio…</p>
    </div>
    <div class="tools"><input type="search" id="q" placeholder="Filtrar por título o resumen" aria-label="Filtrar"></div>
  </header>
  <ol class="list" id="list"><li class="state">Cargando…</li></ol>
</div>

<script>
// Repositorio: se deduce de la dirección de GitHub Pages; si no, usa estos valores.
const FALLBACK_OWNER = "Jookruger";
const FALLBACK_REPO  = "monos";
const BRANCH = "";            // vacío = rama por defecto
const CARPETA = "";           // "" = raíz del repositorio; o por ejemplo "diagramas"

const host = location.hostname;
const OWNER = host.endsWith(".github.io") ? host.split(".")[0] : FALLBACK_OWNER;
const seg = location.pathname.split("/").filter(Boolean);
const REPO = host.endsWith(".github.io") && seg.length && !seg[0].endsWith(".html") ? seg[0] : FALLBACK_REPO;
const API = `https://api.github.com/repos/${OWNER}/${REPO}`;
const ref = BRANCH ? `?ref=${BRANCH}` : "";

const $list = document.getElementById("list"), $sub = document.getElementById("sub"), $q = document.getElementById("q");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const recorta = (s, n = 120) => { s = (s || "").replace(/\s+/g, " ").trim(); return s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s; };
const fmt = d => d ? d.toLocaleDateString("es-CL", {day:"2-digit", month:"2-digit", year:"numeric"}) : "sin fecha";

function cache(key, val){ try{ if(val===undefined) return JSON.parse(sessionStorage.getItem(key)); sessionStorage.setItem(key, JSON.stringify(val)); }catch(e){ return null; } }

async function listar(){
  const k = "monos:list:" + CARPETA, c = cache(k); if (c) return c;
  const r = await fetch(`${API}/contents/${CARPETA}${ref}`);
  if (!r.ok) throw new Error(r.status === 403 ? "La API de GitHub limitó las consultas por ahora; vuelve a cargar en unos minutos." : "No se pudo leer el repositorio (" + r.status + ").");
  const files = (await r.json()).filter(f => f.type === "file" && /\.html?$/i.test(f.name) && !/^index\.html?$/i.test(f.name) && !f.name.startsWith("_"));
  cache(k, files); return files;
}

async function fechaCommit(path){
  const k = "monos:date:" + path, c = cache(k); if (c) return new Date(c);
  try{
    const r = await fetch(`${API}/commits?path=${encodeURIComponent(path)}&per_page=1${BRANCH ? "&sha=" + BRANCH : ""}`);
    if (!r.ok) return null;
    const j = await r.json(); const d = j[0]?.commit?.committer?.date; if (d) cache(k, d); return d ? new Date(d) : null;
  }catch(e){ return null; }
}

async function leer(f){
  const url = (CARPETA ? CARPETA + "/" : "") + f.name;
  let html = "", lm = null;
  try{ const r = await fetch(url, {cache:"no-cache"}); html = await r.text(); lm = r.headers.get("last-modified"); }catch(e){}
  const doc = new DOMParser().parseFromString(html, "text/html");
  const meta = n => doc.querySelector(`meta[name="${n}"]`)?.getAttribute("content")?.trim();
  if ((meta("monos") || "").toLowerCase() === "ocultar") return null;
  const titulo = doc.querySelector("title")?.textContent?.trim() || f.name.replace(/\.html?$/i, "").replace(/[-_]+/g, " ");
  let resumen = meta("description") || meta("og:description");
  if (!resumen){ doc.querySelectorAll("script,style,noscript").forEach(n => n.remove()); const p = [...doc.querySelectorAll("p")].map(n => n.textContent.trim()).find(t => t.length > 30); resumen = p || doc.body?.textContent || ""; }
  let fecha = meta("fecha") ? new Date(meta("fecha") + "T12:00:00") : null;
  if (!fecha || isNaN(fecha)) fecha = await fechaCommit(f.path);
  if (!fecha && lm) fecha = new Date(lm);
  return { url, archivo: f.name, titulo, resumen: recorta(resumen), fecha, numero: meta("numero") };
}

function pintar(items){
  const q = $q.value.trim().toLowerCase();
  const vis = items.filter(i => !q || (i.titulo + " " + i.resumen).toLowerCase().includes(q));
  $list.innerHTML = vis.length ? vis.map(i => `
    <li class="item"><a class="row" href="${esc(i.url)}">
      <div class="thumb"><span class="ph">${esc(i.archivo.replace(/\.html?$/i,""))}</span><iframe src="${esc(i.url)}" loading="lazy" tabindex="-1" aria-hidden="true" scrolling="no"></iframe></div>
      <div>
        <div class="meta"><span class="num">N° ${esc(i.n)}</span><span>${fmt(i.fecha)}</span></div>
        <div class="title">${esc(i.titulo)}</div>
        <p class="sum">${esc(i.resumen)}</p>
        <div class="file">${esc(i.archivo)}</div>
      </div>
    </a></li>`).join("") : `<li class="state">${q ? "Ningún diagrama coincide con el filtro." : "Todavía no hay archivos HTML en el repositorio."}</li>`;
}

(async () => {
  try{
    const files = await listar();
    const items = (await Promise.all(files.map(leer))).filter(Boolean);
    // Número: el declarado en el archivo o el orden cronológico, del más antiguo al más nuevo.
    [...items].sort((a, b) => (a.fecha || 0) - (b.fecha || 0)).forEach((it, k) => it.n = it.numero || String(k + 1).padStart(2, "0"));
    items.sort((a, b) => (b.fecha || 0) - (a.fecha || 0));
    $sub.textContent = `${items.length} ${items.length === 1 ? "diagrama" : "diagramas"} · ${OWNER}/${REPO}`;
    pintar(items);
    $q.addEventListener("input", () => pintar(items));
  }catch(e){
    $sub.textContent = `${OWNER}/${REPO}`;
    $list.innerHTML = `<li class="state">${esc(e.message)}</li>`;
  }
})();
</script>
</body>
</html>
